# PostgreSQL para desenvolvimento e testes locais.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: erp_owner
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_dev
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
