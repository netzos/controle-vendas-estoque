name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_owner
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_OWNER_DATABASE_URL: postgres://erp_owner:erp@localhost:5432/erp_test
      TEST_DATABASE_URL: postgres://erp_app_login:app@localhost:5432/erp_test
      DATABASE_URL: postgres://erp_app_login:app@localhost:5432/erp_test
      MIGRATION_DATABASE_URL: postgres://erp_owner:erp@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Papéis do banco
        run: |
          PGPASSWORD=erp psql -h localhost -U erp_owner -d erp_test -c "CREATE ROLE erp_app NOLOGIN; CREATE ROLE erp_app_login LOGIN PASSWORD 'app' IN ROLE erp_app;"
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build do painel
        run: pnpm db:migrate && pnpm --filter @erp/web build
